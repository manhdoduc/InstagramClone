worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;
    error_log  /var/log/nginx/error.log;

    upstream web {
        server instagramclone.web:8080;
    }

    upstream api {
        server instagramclone.api:8080;
    } 

    # Reverse Proxy Server
    server {
        listen 443 ssl;
        ssl_certificate /etc/ssl/certs/api-cert.crt;
        ssl_certificate_key /etc/ssl/private/api-cert.key;

        server_name  localhost api.instagramclone.com;

        location / {
            proxy_pass         http://instagramclone.web:8080;
            proxy_redirect     off;
            proxy_set_header   Host $host:44391;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # WebSockets for Blazor Server
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
        }

        location /api/ {
            proxy_pass         http://instagramclone.api:8080;
            proxy_redirect     off;
            proxy_set_header   Host $host:44391;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location /chathub {
            proxy_pass         http://instagramclone.api:8080;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "Upgrade";
            proxy_set_header   Host $host:44391;
        }

        location /hubs/ {
            proxy_pass         http://instagramclone.api:8080;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "Upgrade";
            proxy_set_header   Host $host:44391;
        }
    }
}
